# 自动化发布：推送 vX.Y.Z tag 即触发构建 Docker 镜像
# 发布流程（由负责人确认"发版"后执行）：
#   1. 将 package.json 的 version 改为目标版本（如 4.2.0），合并到 main 并推送
#   2. 在 main 上打 tag vX.Y.Z（与 package.json version 一致）并推送
#   3. 本工作流监听到 v* tag 自动触发，用 tag 名作为发布版本
#
# 全程使用 GITHUB_TOKEN，无需额外配置 PAT
# 说明：GITHUB_TOKEN 触发的 tag 推送不会再次触发本 workflow，避免递归

name: Publish

on:
  # 监听 v 开头的 git tag 推送，自动开始发布构建
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish & build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      # 版本号直接取自 tag（去掉 v 前缀），核对语义化版本格式，避免误触发
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag 格式应为 vX.Y.Z，实际为 $TAG"
            exit 1
          fi
          echo "current=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Show resolved version
        run: |
          echo "发布版本: ${{ steps.version.outputs.new }} (tag: ${{ steps.version.outputs.tag }})"
          grep '"version"' package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 镜像仓库名必须为小写，ghcr.io 不支持大写
      - name: Compute image name
        id: image
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.new }}
            ${{ steps.image.outputs.name }}:latest
          labels: ${{ steps.meta.outputs.labels }}
