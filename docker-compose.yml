services:
  SPlayer:
    build:
      context: .
    image: splayer
    container_name: SPlayer
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - 25884:25884
    restart: always
    environment:
      # 所有变量都不是必填项
      # UnblockNeteaseMusic 使用的音源（后端内置解灰）, 支持列表见 https://github.com/UnblockNeteaseMusic/server?tab=readme-ov-file#%E9%9F%B3%E6%BA%90%E6%B8%85%E5%8D%95
      - UNBLOCK_SOURCES=kugou kuwo bilibili
      # 是否启用后端内置解灰（默认开启）
      # - UNM_ENABLED=false
      # 内置解灰可用的其他环境变量
      - ENABLE_FLAC=false
      - ENABLE_HTTPDNS=false
      - BLOCK_ADS=true
      - DISABLE_UPGRADE_CHECK=false
      - DEVELOPMENT=false
      - FOLLOW_SOURCE_ORDER=true
      - JSON_LOG=false
      - NO_CACHE=false
      - SELECT_MAX_BR=true
      - LOG_LEVEL=info
      - SEARCH_ALBUM=true
      # DLNA 投送固定拉流基址（可选）：使用域名访问时建议配置为内网地址，
      # 使电视始终走局域网拉流，与访问入口解耦，如 http://192.168.5.100:25884
      # - DLNA_BASE_URL=http://192.168.5.100:25884
