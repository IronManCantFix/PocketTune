server {
  gzip on;
  listen       25884;
  listen  [::]:25884;
  server_name  localhost;
  client_max_body_size 100M;

  location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri/ /index.html;
  }

  # 入口首页不缓存，保证重开浏览器时始终拉取最新版本，避免旧版界面/功能
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # 带 hash 的 JS/CSS 资源可长期缓存，文件名变化即是新版本
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 其余静态资源（字体、图标、图片、wasm 等）适度缓存
  location ~* \.(eot|ttf|otf|woff2?|svg|png|jpe?g|gif|webp|ico|wasm)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location @rewrites {
    rewrite ^(.*)$ /index.html last;
  }

  # 歌曲链接接口：响应中的网易云直链需改写为本地解灰代理
  location /api/netease/song/url/v1 {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    # 原样转发，不重写路径
    proxy_pass              http://localhost:3000;

    sub_filter              '"url":"http://music.163.com' '"url":"/music/unblock';
    sub_filter              '"url":"https://music.163.com' '"url":"/music/unblock';
    sub_filter_types        application/json;
    sub_filter_once         off;
  }

  # 其余 API 请求统一转发到本地后端，不重写路径
  location /api/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000;
  }

  # 解灰音源代理
  location /music/unblock/ {
    proxy_pass              https://music.163.com/;
    proxy_buffering         off;
    proxy_request_buffering off;
  }
}
